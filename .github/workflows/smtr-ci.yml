name: SMTR Web CI (shared POS API)

on:
  push:
    paths:
      - 'smtr/**'
      - '.github/workflows/smtr-ci.yml'
  pull_request:
    paths:
      - 'smtr/**'
      - '.github/workflows/smtr-ci.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smtr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
